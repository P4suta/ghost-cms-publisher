name: release-plz

# Dormant until the RELEASE_PLZ_APP_* secrets are set; otherwise every step skips.
# A GitHub App identity is required because a tag pushed by the default
# GITHUB_TOKEN cannot trigger release.yml.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'P4suta'
    permissions:
      contents: write
      pull-requests: write
    environment: release-plz
    steps:
      - name: Detect app credentials
        id: app
        env:
          CID: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CID" ] && [ -n "$KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::release-plz is dormant — set RELEASE_PLZ_APP_CLIENT_ID and RELEASE_PLZ_APP_PRIVATE_KEY to activate."
          fi
      - name: Mint app token
        if: steps.app.outputs.have == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout
        if: steps.app.outputs.have == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - name: Install Rust
        if: steps.app.outputs.have == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: release-plz release-pr
        if: steps.app.outputs.have == 'true'
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'P4suta'
    permissions:
      contents: write
    environment: release-plz
    steps:
      - name: Detect app credentials
        id: app
        env:
          CID: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CID" ] && [ -n "$KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint app token
        if: steps.app.outputs.have == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout
        if: steps.app.outputs.have == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - name: Install Rust
        if: steps.app.outputs.have == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: release-plz release
        if: steps.app.outputs.have == 'true'
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
