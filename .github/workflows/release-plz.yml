name: release-plz

# Dormant until the RELEASE_PLZ_APP_* secrets are set; otherwise every step skips.
# A GitHub App identity is required because a tag pushed by the default
# GITHUB_TOKEN cannot trigger release.yml.

on:
  push:
    branches: [main]

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'P4suta'
    permissions:
      contents: write # Commit version and changelog changes.
      pull-requests: write # Open and update release pull requests.
    environment: release-plz
    steps:
      - name: Detect app credentials
        id: app
        env:
          CID: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CID" ] && [ -n "$KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::release-plz is dormant — set RELEASE_PLZ_APP_CLIENT_ID and RELEASE_PLZ_APP_PRIVATE_KEY to activate."
          fi
      - name: Mint app token
        if: steps.app.outputs.have == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        if: steps.app.outputs.have == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - name: Install Rust
        if: steps.app.outputs.have == 'true'
        run: rustup toolchain install --no-self-update
      - name: release-plz release-pr
        if: steps.app.outputs.have == 'true'
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'P4suta'
    permissions:
      contents: write # Create approved version tags.
    environment: release-plz
    steps:
      - name: Detect app credentials
        id: app
        env:
          CID: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CID" ] && [ -n "$KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint app token
        if: steps.app.outputs.have == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Checkout
        if: steps.app.outputs.have == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - name: Install Rust
        if: steps.app.outputs.have == 'true'
        run: rustup toolchain install --no-self-update
      - name: release-plz release
        if: steps.app.outputs.have == 'true'
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
