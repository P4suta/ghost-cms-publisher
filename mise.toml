# Keep the Rust pin aligned with rust-toolchain.toml.

[tools]
rust = "1.99.1"
just = "1.59.0"
lefthook = "2.2.2"
typos = "1.51.1"
taplo = "0.10.0"

# cargo-binstall fetches prebuilt binaries for the cargo: tools below.
cargo-binstall = "1.26.0"
"cargo:cargo-nextest" = "0.9.146"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-sort" = "2.1.4"
"cargo:committed" = "1.1.11"
"cargo:cargo-insta" = "1.49.0"

[settings.cargo]
binstall = true

# Non-secret defaults. The site URL and Staff Access Token are NOT set here —
# provide them via `.env` (git-ignored) or the 1Password flow (.env.op).
[env]
GHOST_ACCEPT_VERSION = "v5.0"
GHOST_BLOG_DIR = "blog"
